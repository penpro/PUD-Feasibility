  - id: S024
    title: "Campaign finance for KPUD Proposition 1 (2026): committee totals and contributions"
    publisher: WA Public Disclosure Commission via data.wa.gov (datasets 3h9x-7bvm and kv7h-kjye)
    kind: primary
    url: https://data.wa.gov/Politics/Contributions-to-Candidates-and-Political-Committ/kv7h-kjye
    accessed: 2026-11-04
    files: [data/raw/wa_pdc_prop1/*/*.json]
    notes: >-
      Socrata API queries; exact strings in scripts/fetch_campaign_finance.py (QUERIES). Committees found by
      the measure, not by name: jurisdiction='KITSAP PUD 01' AND election_year=2026 AND for_or_against in
      ('for','against'). Snapshot 2026-11-04 (reports updated through 2026-10-27):
      No: "Coalition to Protect Kitsap Power Sponsored by Puget Sound Energy" (PDC registration 70128;
      contributions before its rename appear as "Coalition to Protect Kitsap Power") raised $2,401,233.33
      and spent $2,304,528.34. Puget Sound Energy gave $2,318,178.33 ($2,100,000 cash on 2026-08-20 and
      2026-09-08, $218,178.33 in-kind), 96.5% of the total. Other No contributors: Edison Electric
      Institute $25,000, Sound View Strategies $23,055 in-kind, Northwest Regional Organizing Coalition PAC
      $15,000, Potelco $10,000, WA State Association of Electrical Workers $10,000. Itemized contributions
      sum exactly to the committee total.
      Yes: "Unplug PSE" (registration 70079) raised $9,055.00 (27 individual contributions, $6,055;
      3 organizational, $3,000) and spent $7,252.97. Individual donors are archived only as counts and sums.
      Post-election reports will change these totals; rerun the script to add a snapshot.

  - id: S025
    title: "Puget Energy, Inc. and Puget Sound Energy, Inc. Form 10-K for fiscal year 2025 (filed 2026-02-19)"
    publisher: Puget Energy, Inc. / Puget Sound Energy, Inc. via SEC EDGAR (accession 0001085392-26-000008)
    kind: primary
    url: https://www.sec.gov/Archives/edgar/data/1085392/000108539226000008/psd-20251231.htm
    accessed: 2026-11-04
    files: [data/raw/sec_puget_energy_10k_fy2025/psd-20251231.htm]
    notes: >-
      Item 1: Puget Holdings, which indirectly owns all of Puget Energy (PSE's parent), "is owned by a consortium
      of long-term infrastructure investors including" BCIMC, AIMCo, OMERS (Canada), Ontario Teachers' Pension Plan
      (Canada), PGGM Vermogensbeheer (Netherlands) and Macquarie Washington Clean Energy Investment, L.P. (managed
      by Australia-based Macquarie; its own investors are not disclosed). No ownership percentages are given.
      Puget Energy consolidated statements (USD thousands, 2025 / 2024 / 2023): net income 369,368 / 265,255 /
      53,740; dividends paid 62,887 / 175,861 / 99,760; capital contribution from owners 0 / 292,800 / 0.
      PSE alone: net income 458,715 / 346,148 / 131,059 (before Puget Energy's holding-company interest).
      Power supply (Item 1): capacity reductions of 1,050 MW "planned to be offset by 1,365 MW" from the Gray's Harbor
      contract (665 MW) and the conversion of TransAlta's Centralia coal plant "to a combined cycle plant for 700 MW
      in 2028"; projected capacity shortfall of 576 MW in 2026 and 1,404 MW by 2030, covered in 2026 through market
      purchases and other activities. Tariff Schedule 95 is PSE's Power Cost Adjustment mechanism.

  - id: S026
    title: "Revised Code of Washington sections on PUD electric authority, studies, debt and carbon allowances"
    publisher: Washington State Legislature (certified 2024-07-12 for the RCW 54 sections)
    kind: primary
    url: https://app.leg.wa.gov/RCW/default.aspx?cite=54.16.010
    accessed: 2026-11-05
    files: [data/raw/wa_rcw/*.pdf]
    notes: >-
      Same URL pattern for each cite, with &pdf=true for the archived copy. RCW 54.16.010: a district "may make surveys,
      plans, investigations or studies" for electric generation, transmission and distribution systems; it names no
      vote. RCW 54.08.070: a district like KPUD "shall not construct or acquire" electric facilities without voter
      approval, and the proposal goes to voters at a general election in an even-numbered year. RCW 54.16.020:
      purchase and eminent domain. RCW 54.24.018: general indebtedness that takes non-voter debt above three-fourths
      of one percent of taxable value goes to voters; subsection (3) lets the commission issue revenue bonds payable
      only from a special fund when it does not want general indebtedness, and it mentions no vote. A separate
      sentence on a three-fifths vote refers to "general or public utility bonds", so the text is not fully settled
      (OQ-16). RCW 70A.65.120: consumer-owned and investor-owned electric utilities are eligible for no-cost carbon
      allowances "to mitigate the cost burden" on customers. This is our reading of the text, not legal advice.

