  - id: S012
    title: "Electric Vehicle Population Data (WA DOL registrations), Kitsap County aggregates"
    publisher: WA Department of Licensing via data.wa.gov (dataset f6w7-q2d2)
    kind: primary
    url: https://data.wa.gov/Transportation/Electric-Vehicle-Population-Data/f6w7-q2d2
    accessed: 2026-11-04
    files: [data/raw/wa_dol_ev_population/*.json]
    notes: >-
      Socrata API queries (base https://data.wa.gov/resource/f6w7-q2d2.json):
      [1] $select=ev_type,electric_utility,count(*)&$where=county='Kitsap'&$group=ev_type,electric_utility;
      [2] $select=model_year,count(*)&$where=county='Kitsap'&$group=model_year;
      [3] dataset metadata from https://data.wa.gov/api/views/f6w7-q2d2.json.
      Rows last updated 2026-10-14. Kitsap: 8,011 BEV + 2,335 PHEV attributed to PSE, 36 with no
      known utility, 1 split PSE/Tacoma, 10,383 total. DOL attributes no Kitsap EVs to Peninsula
      Light or Mason PUD 3, so its utility mapping is coarse.

