  - id: S010
    title: "Form EIA-861 Annual Electric Power Industry Report, 2025 data (final release)"
    publisher: U.S. Energy Information Administration
    kind: primary
    url: https://www.eia.gov/electricity/data/eia861/zip/f8612025.zip
    accessed: 2026-11-04
    files: [data/raw/eia861_2025/*.xlsx]
    notes: >-
      Relevant workbooks extracted unmodified from f8612025.zip (sheet files dated 2026-10-07).
      Service_Territory lists four utilities in Kitsap County: Puget Sound Energy, Bonneville
      Power Administration, Peninsula Light Company, PUD No 3 of Mason County. Sales_Ult_Cust
      gives customers/MWh/revenue by class per utility (PSE = utility 15500; Part A bundled,
      Part C delivery-only). Operational_Data gives peaks and losses.

