# Source registry: the single place where every source is recorded.
#
#   Edit THIS file, then run:  python scripts/sources.py build
#   That regenerates data/SOURCES.md and data/raw/MANIFEST.sha256, and fails if
#   any file in data/raw/ is not claimed by a source below (or a claimed file is missing).
#
# Fields
#   id         stable ID cited from model/config.yaml and docs (never reuse an ID)
#   kind       primary | secondary | third-party | advocacy
#              primary     = the agency/utility that produced the number (EIA, Ecology, BPA, county)
#              secondary   = journalism reporting someone else's number
#              third-party = aggregator/commercial site with undisclosed method
#              advocacy    = a party to the debate speaking for itself (PSE, campaign committees)
#   files      paths under data/raw/ (globs allowed). Empty = not archived (see archive_note)
#   archive_note  why there is no local copy (copyrighted news, commercial site, fetch blocked)

sources:
  - id: S001
    title: "Exploring Electric Service in Kitsap County (web page)"
    publisher: Kitsap Public Utility District
    kind: primary
    url: https://www.kpud.org/governance/exploring-electric-service-in-kitsap-county/
    accessed: 2026-11-04
    files: [data/raw/kpud_electric_page/exploring-electric-service_2026-11-04.html]
    notes: >-
      Board committed to a comprehensive feasibility study if Prop 1 passes; says no decision
      has been made to provide electric service. The $300k-$500k study cost is NOT on this page;
      it is in the Fact Publication (S002).

  - id: S002
    title: "KPUD Proposition 1 Fact Publication (dated 08.2026)"
    publisher: Kitsap Public Utility District
    kind: primary
    url: https://www.kpud.org/wp-content/uploads/FINAL-KPUD-Prop-1-Fact-Publication.pdf
    accessed: 2026-11-04
    files: [data/raw/kpud_fact_publication/FINAL-KPUD-Prop-1-Fact-Publication.pdf]
    notes: >-
      p.3: feasibility study "estimated to cost between $300,000 and $500,000"; of four electric
      authority measures in WA in 2008 and 2012, one was approved. p.2: a "No" vote means the
      study "would not move forward." p.4: no power source selected; BPA named as one option;
      condemnation authority under RCW 54.16.020; Jefferson PUD took "approximately five years."
      p.2: Prop 1 does not "Approve financing or issuance of bonds"; a later decision would be made "by the Board
      during a public meeting" (no second vote is promised). p.3: the Board chose to ask voters before studying,
      "prudent to seek voter direction first", given the study's cost and past votes. The publication does not say
      how the study would be funded.
      Note: p.2 misstates the election date as November 4, 2026 (it was November 3).

