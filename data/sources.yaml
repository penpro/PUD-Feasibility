  - id: S035
    title: "BPA Provider of Choice Policy (March 2024) and CHWM Implementation Policy (2025-08-14)"
    publisher: Bonneville Power Administration
    kind: primary
    url: https://bpa.gov/-/media/Aep/power/provider-of-choice/provider-of-choice-policy-march-2024.pdf
    accessed: 2026-11-05
    files:
      - data/raw/bpa_provider_of_choice/provider-of-choice-policy-march-2024.pdf
      - data/raw/bpa_provider_of_choice/chwm-implementation-policy-20250814.pdf
    notes: >-
      Also https://bpa.gov/-/media/Aep/power/provider-of-choice/chwm-implementation-policy-20250814.pdf. POC Policy
      s.2.4.2.2: Tier 1 for new public utilities limited "to a total of 200 aMW during the Provider of Choice contract
      period, with no more than 50 aMW added in any rate period", "first come, first serve"; above those limits a new
      public buys only at PF Tier 2 rates for net requirements until the next long-term contract. s.2.4.2.3: tribal
      utility adjustments (up to 40 aMW) count against the same limits. s.11.1: contracts expire 2044-09-30. CHWM Policy
      (repeats the limits) s.3.2.1: a new public is "a newly formed public utility that is not an existing customer of
      Bonneville"; it must request service by the earlier of three years before the service date or March 1 of the forecast
      year for the next rate period. s.3.2.1.3.2: requests above the limit are prorated and phased in. Not settled here:
      whether KPUD, an existing PUD, counts as "newly formed" (OQ-06).

