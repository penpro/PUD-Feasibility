  - id: S037
    title: "No-cost allowance allocation (web page)"
    publisher: WA Department of Ecology
    kind: primary
    url: https://ecology.wa.gov/air-climate/climate-commitment-act/cap-and-invest/no-cost-allowances
    accessed: 2026-11-05
    files: [data/raw/wa_ecology_auctions/ecology_no_cost_allowances_page.html]
    notes: >-
      Electric utilities subject to the Clean Energy Transformation Act are eligible. They must use no-cost allowances for
      compliance, save them, transfer them where eligible, or sell them at quarterly auctions, with proceeds benefiting customers.
      Lists a 2023-2030 allocation schedule (publication 23-02-031) and data set, revised October 2026. Our copy does not
      include the schedule itself. How a utility that starts after the schedule was set would be treated is OQ-22.
